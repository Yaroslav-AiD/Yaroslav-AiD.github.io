<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAROSLAV-AiD</title>
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(5, 5, 20, 0.85) 100%);
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
        
        /* ========== ДЕСКТОП: МЕНЮ ========== */
        .menu-panel {
            position: absolute;
            top: 0;
            right: -420px;
            width: 380px;
            height: 100%;
            background: rgba(8, 12, 24, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(100, 150, 255, 0.15);
            z-index: 30;
            transition: right 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 50px;
            box-sizing: border-box;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.02em;
        }
        .menu-panel.open {
            right: 0;
        }
        .menu-panel h2 {
            color: #fff;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 34px;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-top: -20px;
        }
        .menu-panel a {
            color: rgba(220, 225, 245, 0.75);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 400;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s ease;
            display: block;
            cursor: pointer;
            position: relative;
        }
        .menu-panel a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 1px;
            background: rgba(120, 170, 255, 0.7);
            transition: width 0.4s ease;
        }
        .menu-panel a:hover {
            color: #fff;
            padding-left: 20px;
        }
        .menu-panel a:hover::after {
            width: 100%;
        }
        .menu-close {
            position: absolute;
            top: 28px;
            right: 28px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-close:hover {
            opacity: 1;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        canvas.blurred {
            filter: blur(8px);
        }
        
        /* ========== МОБИЛЬНАЯ: ОВЕРЛЕЙ ========== */
        .mobile-overlay {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            padding-bottom: 60px;
        }
        .mobile-overlay .rotating-text {
            color: rgba(180, 180, 180, 0.3);
            -webkit-text-stroke: 1px rgba(160, 160, 160, 0.5);
            text-shadow: 
                0 0 10px rgba(160, 160, 160, 0.3),
                0 0 30px rgba(160, 160, 160, 0.15),
                0 0 0 2px rgba(140, 140, 140, 0.2);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
            transition: opacity 0.6s ease;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(140, 170, 255, 0.3);
        }
        .mobile-overlay .contacts {
            color: rgba(180, 180, 180, 0.5);
            font-size: 1rem;
            letter-spacing: 0.15em;
            padding-left: 30px;
            padding-right: 30px;
            line-height: 1.8;
            font-weight: 300;
        }
        
        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 767px) {
            .menu-panel {
                display: none;
            }
            .mobile-overlay {
                display: block;
            }
            canvas.blurred {
                filter: blur(4px);
            }
            body::after {
                background: radial-gradient(circle, transparent 70%, rgba(5, 5, 20, 0.3) 100%);
            }
        }
        
        @media (min-width: 768px) {
            .mobile-overlay {
                display: none;
            }
            .menu-panel {
                display: flex;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-overlay .rotating-text {
            animation: fadeIn 1.2s ease forwards;
        }
    </style>
</head>
<body>
    <!-- ДЕСКТОПНОЕ МЕНЮ -->
    <div class="menu-panel" id="menuPanel">
        <button class="menu-close" id="menuClose">✕</button>
        <h2>YAROSLAV-AiD</h2>
        <a href="#">• Разработка</a>
        <a href="#">• Автоматизация</a>
        <a href="#">• AI-интеграции</a>
        <a href="#" style="margin-top: 30px;">diai_9@proton.me</a>
    </div>
    
    <!-- МОБИЛЬНЫЙ ОВЕРЛЕЙ -->
    <div class="mobile-overlay" id="mobileOverlay">
        <div class="rotating-text" id="rotatingText">YAR-AiD</div>
        <div class="contacts">
            Telegram: @moslav9
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        
        const isMobile = window.innerWidth < 768;
        
        // ==================== ДЕСКТОПНАЯ СЦЕНА ====================
        if (!isMobile) {
            const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
            const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
            const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
            
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x050510, 0.00015);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050510, 1);
            document.body.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.5;

            const composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // ---- СФЕРА ----
            const sphereGroup = new THREE.Group();
            const radius = 1.2;
            const vectorCount = 2500;
            const linesGroup = new THREE.Group();
            
            for (let i = 0; i < vectorCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                const start = new THREE.Vector3(x, y, z);
                const normal = start.clone().normalize();
                const lengthVariation = 0.15 + Math.random() * 0.35;
                const end = start.clone().add(normal.multiplyScalar(lengthVariation));
                
                const mixFactor = (y / radius) * 0.5 + 0.5;
                const color = new THREE.Color().lerpColors(
                    new THREE.Color(0x00aaff),
                    new THREE.Color(0xaa44ff),
                    mixFactor
                );
                
                const lineGeo = new THREE.BufferGeometry();
                const vertices = new Float32Array([ start.x, start.y, start.z, end.x, end.y, end.z ]);
                lineGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                
                const lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
                const line = new THREE.Line(lineGeo, lineMat);
                
                line.userData = {
                    baseEnd: end.clone(),
                    normal: normal,
                    originalLength: lengthVariation,
                    start: start.clone(),
                    baseColor: color.clone(),
                    currentColor: color.clone()
                };
                
                linesGroup.add(line);
            }
            
            sphereGroup.add(linesGroup);
            
            const glowGeo = new THREE.BufferGeometry();
            const glowPositionsArr = [];
            linesGroup.children.forEach(line => {
                const positions = line.geometry.attributes.position.array;
                glowPositionsArr.push(positions[3], positions[4], positions[5]);
            });
            glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositionsArr), 3));
            const glowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.015, blending: THREE.AdditiveBlending, depthWrite: false });
            const glowPoints = new THREE.Points(glowGeo, glowMat);
            sphereGroup.add(glowPoints);
            scene.add(sphereGroup);

            // ---- ФОН ----
            const canvas2d = document.createElement('canvas');
            canvas2d.width = 32; canvas2d.height = 32;
            const ctx = canvas2d.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
            gradient.addColorStop(0, 'rgba(130, 150, 200, 1)');
            gradient.addColorStop(0.5, 'rgba(80, 130, 180, 0.6)');
            gradient.addColorStop(1, 'rgba(50, 50, 150, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            const particleTexture = new THREE.CanvasTexture(canvas2d);

            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 5500;
            const particlesPositionsArr = new Float32Array(particlesCount * 3);
            const particlesSizesArr = new Float32Array(particlesCount);
            for (let i = 0; i < particlesCount; i++) {
                particlesPositionsArr[i * 3] = (Math.random() - 0.5) * 15;
                particlesPositionsArr[i * 3 + 1] = (Math.random() - 0.5) * 8;
                particlesPositionsArr[i * 3 + 2] = (Math.random() - 0.5) * 10 - 2;
                particlesSizesArr[i] = Math.random() * 0.02 + 0.007;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPositionsArr, 3));
            particlesGeo.setAttribute('size', new THREE.BufferAttribute(particlesSizesArr, 1));

            const particlesMat = new THREE.PointsMaterial({
                map: particleTexture,
                color: 0xaaccff,
                size: 0.03,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.65
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            // ---- ПЕРЕМЕННЫЕ ----
            let mouseX = 0, mouseY = 0;
            let isShaking = false, shakeIntensity = 0;
            let colorCycle = 0;
            let menuOpen = false;
            let targetSphereX = 0;

            // ---- МЕНЮ ----
            const menuPanel = document.getElementById('menuPanel');
            const menuClose = document.getElementById('menuClose');
            const canvas = renderer.domElement;

            function openMenu() {
                menuOpen = true;
                menuPanel.classList.add('open');
                canvas.classList.add('blurred');
                targetSphereX = -1.2;
            }

            function closeMenu() {
                menuOpen = false;
                menuPanel.classList.remove('open');
                canvas.classList.remove('blurred');
                targetSphereX = 0;
            }

            menuClose.addEventListener('click', closeMenu);

            window.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                if (mouseX > 0.8 && !menuOpen) {
                    openMenu();
                }
            });

            document.addEventListener('click', function(e) {
                if (menuOpen) {
                    if (!menuPanel.contains(e.target)) {
                        closeMenu();
                    }
                    return;
                }
                
                if (e.target.tagName === 'CANVAS' || e.target === renderer.domElement) {
                    isShaking = true;
                    shakeIntensity = 0.5;
                    const fadeOut = setInterval(() => {
                        shakeIntensity -= 0.01;
                        if (shakeIntensity <= 0) {
                            shakeIntensity = 0;
                            isShaking = false;
                            clearInterval(fadeOut);
                        }
                    }, 30);
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });

            // ---- АНИМАЦИЯ ----
            function animate() {
                requestAnimationFrame(animate);
                sphereGroup.position.x = THREE.MathUtils.lerp(sphereGroup.position.x, targetSphereX, 0.05);
                sphereGroup.rotation.y += 0.0003;
                
                colorCycle += 0.0005;
                const colorShift = Math.sin(colorCycle) * 0.5 + 0.5;
                
                linesGroup.children.forEach((line, index) => {
                    if (line.userData && line.userData.baseEnd) {
                        const positions = line.geometry.attributes.position.array;
                        const start = line.userData.start;
                        const baseEnd = line.userData.baseEnd;
                        let currentEnd = baseEnd.clone();
                        
                        if (shakeIntensity > 0) {
                            const noise = 0.1 * shakeIntensity;
                            const time = Date.now() * 0.01;
                            const randomOffset = new THREE.Vector3(
                                Math.sin(time + index) * noise,
                                Math.cos(time * 0.8 + index) * noise,
                                Math.sin(time * 0.7 + index) * noise
                            );
                            currentEnd.add(randomOffset);
                        }
                        
                        positions[3] = currentEnd.x;
                        positions[4] = currentEnd.y;
                        positions[5] = currentEnd.z;
                        line.geometry.attributes.position.needsUpdate = true;
                        
                        const baseColor = line.userData.baseColor;
                        const targetColor = baseColor.clone();
                        targetColor.r = Math.min(1, baseColor.r + colorShift * 0.3);
                        targetColor.b = Math.min(1, baseColor.b + (1 - colorShift) * 0.3);
                        line.material.color.lerp(targetColor, 0.01);
                    }
                });
                
                particles.rotation.y += 0.0001;
                particles.rotation.x += 0.00005;
                particles.position.x = mouseX * 0.5;
                particles.position.y = mouseY * 0.3;

                composer.render();
            }
            animate();
        }
        
        // ==================== МОБИЛЬНАЯ СЦЕНА ====================
        if (isMobile) {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // ==================== СФЕРА — СЕРАЯ ====================
            const sphereGroup = new THREE.Group();
            const geometry = new THREE.IcosahedronGeometry(0.8, 4);
    
            const edgesGeo = new THREE.EdgesGeometry(geometry);
            const edgesMat = new THREE.LineBasicMaterial({ 
                color: 0x666666, transparent: true, opacity: 0.35 
            });
            sphereGroup.add(new THREE.LineSegments(edgesGeo, edgesMat));
    
            const verts = geometry.attributes.position.array;
            const pointsArr = [];
            for (let i = 0; i < verts.length; i += 3) pointsArr.push(verts[i], verts[i+1], verts[i+2]);
            const pointsGeo = new THREE.BufferGeometry();
            pointsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pointsArr), 3));
            sphereGroup.add(new THREE.Points(pointsGeo, new THREE.PointsMaterial({
                color: 0x999999, size: 0.018, depthWrite: false
            })));
            sphereGroup.position.y = 0.4;
            scene.add(sphereGroup);

            // ==================== ПЕРВОЕ КОЛЬЦО-СТАНЦИЯ ====================
            const stationGroup = new THREE.Group();
            const ringRadius = 1.2;
            const ringWidth = 0.18;
            const sectionCount = 20;

            // Генератор древнего текста
            function generateAncientText(length) {
                const chars = [
                    'ᚠ', 'ᚡ', 'ᚢ', 'ᚣ', 'ᚤ', 'ᚥ', 'ᚦ', 'ᚧ', 'ᚨ', 'ᚩ', 'ᚪ', 'ᚫ', 'ᚬ', 'ᚭ', 'ᚮ', 'ᚯ',
                    'ᚰ', 'ᚱ', 'ᚲ', 'ᚳ', 'ᚴ', 'ᚵ', 'ᚶ', 'ᚷ', 'ᚸ', 'ᚹ', 'ᚺ', 'ᚻ', 'ᚼ', 'ᚽ', 'ᚾ', 'ᚿ',
                    '⫗', '⫘', '⫙', '⫚', '⫛', '⫝̸', '⫝', '⫞', '⫟', '⫠', '∿', '≋', '⫡', '⫢', '⫣', '⫤',
                    'ऄ', 'अ', 'आ', 'इ', 'ई', 'उ', 'ऊ', 'ऋ', 'ऌ', 'ऍ', 'ऎ', 'ए', 'ऐ', 'ऑ', 'ऒ', 'ओ',
                    'ᛠ', 'ᛡ', 'ᛢ', 'ᛣ', 'ᛤ', 'ᛥ', 'ᛦ', 'ᛧ', 'ᛨ', 'ᛩ', 'ᛪ', '᛫', '᛬', '᛭', 'ᛮ', 'ᛯ'
                ];
                let text = '';
                for (let i = 0; i < length; i++) {
                    text += chars[Math.floor(Math.random() * chars.length)];
                }
                return text;
            }

            for (let s = 0; s < sectionCount; s++) {
                const startAngle = (s / sectionCount) * Math.PI * 2;
                const endAngle = ((s + 1) / sectionCount) * Math.PI * 2;
                const midAngle = (startAngle + endAngle) / 2;
                
                // Дуга секции
                const curvePoints = [];
                const arcSegments = 16;
                
                for (let j = 0; j <= arcSegments; j++) {
                    const t = startAngle + (j / arcSegments) * (endAngle - startAngle);
                    curvePoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius + ringWidth/2), 0, Math.sin(t) * (ringRadius + ringWidth/2)));
                }
                for (let j = arcSegments; j >= 0; j--) {
                    const t = startAngle + (j / arcSegments) * (endAngle - startAngle);
                    curvePoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius - ringWidth/2), 0, Math.sin(t) * (ringRadius - ringWidth/2)));
                }
                curvePoints.push(curvePoints[0]);
                
                const sectionCurve = new THREE.CatmullRomCurve3(curvePoints, false);
                const tubeMat = new THREE.MeshBasicMaterial({ 
                    color: 0x888888, transparent: true, opacity: 0.25, side: THREE.DoubleSide
                });
                stationGroup.add(new THREE.Mesh(new THREE.TubeGeometry(sectionCurve, 48, 0.006, 6, false), tubeMat));
                
                // Разделители
                const dividerPoints = [
                    new THREE.Vector3(Math.cos(startAngle) * (ringRadius - ringWidth/2), 0, Math.sin(startAngle) * (ringRadius - ringWidth/2)),
                    new THREE.Vector3(Math.cos(startAngle) * (ringRadius + ringWidth/2), 0, Math.sin(startAngle) * (ringRadius + ringWidth/2))
                ];
                const dividerCurve = new THREE.CatmullRomCurve3(dividerPoints, false);
                stationGroup.add(new THREE.Mesh(new THREE.TubeGeometry(dividerCurve, 8, 0.005, 4, false), tubeMat));
                
                // Текстовая текстура секции
                const textCanvas = document.createElement('canvas');
                textCanvas.width = 128;
                textCanvas.height = 64;
                const tctx = textCanvas.getContext('2d');
                tctx.clearRect(0, 0, 128, 64);
                
                tctx.fillStyle = '#999999';
                tctx.font = '11px serif';
                for (let row = 0; row < 5; row++) {
                    tctx.fillText(generateAncientText(12 + Math.floor(Math.random() * 8)), 4, 12 + row * 12);
                }
                
                tctx.fillStyle = '#aaaaaa';
                tctx.font = '16px serif';
                tctx.fillText(generateAncientText(1), 8, 14);
                
                const textTexture = new THREE.CanvasTexture(textCanvas);
                textTexture.minFilter = THREE.LinearFilter;
                textTexture.magFilter = THREE.LinearFilter;
                
                const textPlaneGeo = new THREE.PlaneGeometry(ringWidth * 0.6, 0.08);
                const textPlane = new THREE.Mesh(textPlaneGeo, new THREE.MeshBasicMaterial({ 
                    map: textTexture, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthTest: false, depthWrite: false
                }));
                textPlane.position.set(Math.cos(midAngle) * ringRadius, 0, Math.sin(midAngle) * ringRadius);
                textPlane.rotation.y = -midAngle + Math.PI / 2;
                stationGroup.add(textPlane);
                
                // Мелкие строки текста
                for (let d = 0; d < 2; d++) {
                    const tc2 = document.createElement('canvas');
                    tc2.width = 80; tc2.height = 16;
                    const ctx2 = tc2.getContext('2d');
                    ctx2.fillStyle = '#888888';
                    ctx2.font = '9px serif';
                    ctx2.fillText(generateAncientText(14), 2, 10);
                    
                    const tex2 = new THREE.CanvasTexture(tc2);
                    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ 
                        map: tex2, transparent: true, opacity: 0.35, depthTest: false, depthWrite: false
                    }));
                    const dotAngle = startAngle + Math.random() * (endAngle - startAngle);
                    const dotRadius = (ringRadius - ringWidth/2 + 0.06) + Math.random() * (ringWidth - 0.12);
                    sprite.position.set(Math.cos(dotAngle) * dotRadius, (Math.random() - 0.5) * 0.06, Math.sin(dotAngle) * dotRadius);
                    sprite.scale.set(ringWidth * 0.7, 0.08, 1);
                    stationGroup.add(sprite);
                }
            }

            // Ободы
            const outerPoints = [];
            const innerPoints = [];
            for (let j = 0; j <= 128; j++) {
                const t = (j / 128) * Math.PI * 2;
                outerPoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius + ringWidth/2), 0, Math.sin(t) * (ringRadius + ringWidth/2)));
                innerPoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius - ringWidth/2), 0, Math.sin(t) * (ringRadius - ringWidth/2)));
            }

            const outerCurve = new THREE.CatmullRomCurve3(outerPoints, true);
            stationGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(outerCurve, 100, 0.007, 6, true),
                new THREE.MeshBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
            ));

            const innerCurve = new THREE.CatmullRomCurve3(innerPoints, true);
            stationGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(innerCurve, 100, 0.005, 6, true),
                new THREE.MeshBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
            ));

            stationGroup.position.y = 0.4;
            stationGroup.rotation.x = Math.PI / 2.8;
            stationGroup.rotation.y = Math.PI / 6;
            scene.add(stationGroup);

            // ==================== ВТОРОЕ КОЛЬЦО-СТАНЦИЯ ====================
            const stationGroup2 = new THREE.Group();
            const ringRadius2 = 1.35;
            const ringWidth2 = 0.15;
            const sectionCount2 = 16;

            for (let s = 0; s < sectionCount2; s++) {
                const startAngle = (s / sectionCount2) * Math.PI * 2;
                const endAngle = ((s + 1) / sectionCount2) * Math.PI * 2;
                const midAngle = (startAngle + endAngle) / 2;
                
                const curvePoints = [];
                const arcSegments = 16;
                
                for (let j = 0; j <= arcSegments; j++) {
                    const t = startAngle + (j / arcSegments) * (endAngle - startAngle);
                    curvePoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius2 + ringWidth2/2), 0, Math.sin(t) * (ringRadius2 + ringWidth2/2)));
                }
                for (let j = arcSegments; j >= 0; j--) {
                    const t = startAngle + (j / arcSegments) * (endAngle - startAngle);
                    curvePoints.push(new THREE.Vector3(Math.cos(t) * (ringRadius2 - ringWidth2/2), 0, Math.sin(t) * (ringRadius2 - ringWidth2/2)));
                }
                curvePoints.push(curvePoints[0]);
                
                const tubeMat2 = new THREE.MeshBasicMaterial({ 
                    color: 0x777777, transparent: true, opacity: 0.3, side: THREE.DoubleSide
                });
                stationGroup2.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curvePoints, false), 48, 0.005, 6, false), tubeMat2));
                
                // Разделители
                const dividerPoints = [
                    new THREE.Vector3(Math.cos(startAngle) * (ringRadius2 - ringWidth2/2), 0, Math.sin(startAngle) * (ringRadius2 - ringWidth2/2)),
                    new THREE.Vector3(Math.cos(startAngle) * (ringRadius2 + ringWidth2/2), 0, Math.sin(startAngle) * (ringRadius2 + ringWidth2/2))
                ];
                stationGroup2.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(dividerPoints, false), 8, 0.004, 4, false), tubeMat2));
                
                // Текстовая текстура
                const textCanvas = document.createElement('canvas');
                textCanvas.width = 100; textCanvas.height = 48;
                const tctx = textCanvas.getContext('2d');
                tctx.clearRect(0, 0, 100, 48);
                
                tctx.fillStyle = '#888888';
                tctx.font = '10px serif';
                for (let row = 0; row < 4; row++) {
                    tctx.fillText(generateAncientText(10 + Math.floor(Math.random() * 6)), 3, 10 + row * 11);
                }
                tctx.fillStyle = '#999999';
                tctx.font = '14px serif';
                tctx.fillText(generateAncientText(1), 6, 12);
                
                const textTexture = new THREE.CanvasTexture(textCanvas);
                textTexture.minFilter = THREE.LinearFilter;
                textTexture.magFilter = THREE.LinearFilter;
                
                const textSprite = new THREE.Sprite(new THREE.SpriteMaterial({ 
                    map: textTexture, transparent: true, opacity: 0.7, depthTest: false, depthWrite: false
                }));
                textSprite.position.set(Math.cos(midAngle) * ringRadius2, 0, Math.sin(midAngle) * ringRadius2);
                textSprite.scale.set(ringWidth2 * 0.7, 0.12, 1);
                stationGroup2.add(textSprite);
                
                // Мелкая строка
                const tc2 = document.createElement('canvas');
                tc2.width = 60; tc2.height = 14;
                const ctx2 = tc2.getContext('2d');
                ctx2.fillStyle = '#777777';
                ctx2.font = '8px serif';
                ctx2.fillText(generateAncientText(12), 2, 9);
                
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ 
                    map: new THREE.CanvasTexture(tc2), transparent: true, opacity: 0.7, depthTest: false, depthWrite: false
                }));
                const dotAngle = startAngle + Math.random() * (endAngle - startAngle);
                const dotRadius = (ringRadius2 - ringWidth2/2 + 0.04) + Math.random() * (ringWidth2 - 0.08);
                sprite.position.set(Math.cos(dotAngle) * dotRadius, 0, Math.sin(dotAngle) * dotRadius);
                sprite.scale.set(ringWidth2 * 0.7, 0.06, 1);
                stationGroup2.add(sprite);
            }

            // Ободы второго кольца
            const outer2Points = [];
            const inner2Points = [];
            for (let j = 0; j <= 100; j++) {
                const t = (j / 100) * Math.PI * 2;
                outer2Points.push(new THREE.Vector3(Math.cos(t) * (ringRadius2 + ringWidth2/2), 0, Math.sin(t) * (ringRadius2 + ringWidth2/2)));
                inner2Points.push(new THREE.Vector3(Math.cos(t) * (ringRadius2 - ringWidth2/2), 0, Math.sin(t) * (ringRadius2 - ringWidth2/2)));
            }

            const outerCurve2 = new THREE.CatmullRomCurve3(outer2Points, true);
            stationGroup2.add(new THREE.Mesh(
                new THREE.TubeGeometry(outerCurve2, 100, 0.006, 6, true),
                new THREE.MeshBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
            ));

            const innerCurve2 = new THREE.CatmullRomCurve3(inner2Points, true);
            stationGroup2.add(new THREE.Mesh(
                new THREE.TubeGeometry(innerCurve2, 100, 0.004, 6, true),
                new THREE.MeshBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
            ));

            stationGroup2.position.y = 0.4;
            stationGroup2.rotation.x = Math.PI / 1.6;
            stationGroup2.rotation.y = -Math.PI / 5;
            scene.add(stationGroup2);

            // Клик — ускорение
            renderer.domElement.addEventListener('click', () => {
                const ns = 0.002, fs = 0.04, dur = 1200;
                const st = performance.now();
                function burst(now) {
                    const p = Math.min((now-st)/dur, 1);
                    sphereGroup.rotation.y += fs + (ns-fs)*p;
                    if (p < 1) requestAnimationFrame(burst);
                }
                requestAnimationFrame(burst);
            });

            // ==================== ЧЁРНЫЕ ХЭДЕР И ФУТТЕР ====================
            // ==================== ЧЁРНЫЕ ХЭДЕР И ФУТТЕР ====================
            // Хэддер сверху
            const headerGeo = new THREE.PlaneGeometry(12, 1.4);
            const headerMat = new THREE.MeshBasicMaterial({ 
                color: 0x000000, transparent: true, opacity: 1.0,
                side: THREE.DoubleSide, depthTest: false, depthWrite: false
            });
            const header = new THREE.Mesh(headerGeo, headerMat);
            header.position.set(0, 4.2, 0);
            header.renderOrder = 999;
            scene.add(header);

            // Градиент хэддера
            const headerGradientGeo = new THREE.PlaneGeometry(12, 1.0);
            const headerGradientMat = new THREE.MeshBasicMaterial({ 
                color: 0x000000, transparent: true, opacity: 0.7,
                side: THREE.DoubleSide, depthTest: false, depthWrite: false
            });
            const headerGradient = new THREE.Mesh(headerGradientGeo, headerGradientMat);
            headerGradient.position.set(0, 3.0, 0);
            headerGradient.renderOrder = 998;
            scene.add(headerGradient);
        
            // Футтер снизу
            const footerGeo = new THREE.PlaneGeometry(12, 2.0);
            const footerMat = new THREE.MeshBasicMaterial({ 
                color: 0x000000, transparent: true, opacity: 1.0,
                side: THREE.DoubleSide, depthTest: false, depthWrite: false
            });
            const footer = new THREE.Mesh(footerGeo, footerMat);
            footer.position.set(0, -4.2, 0);
            footer.renderOrder = 999;
            scene.add(footer);

            // Градиент футтера
            const footerGradientGeo = new THREE.PlaneGeometry(12, 1.0);
            const footerGradientMat = new THREE.MeshBasicMaterial({ 
                color: 0x000000, transparent: true, opacity: 0.7,
                side: THREE.DoubleSide, depthTest: false, depthWrite: false
            });
            const footerGradient = new THREE.Mesh(footerGradientGeo, footerGradientMat);
            footerGradient.position.set(0, -3.0, 0);
            footerGradient.renderOrder = 998;
            scene.add(footerGradient);
        
            // ==================== СЕТКА — ЕДВА ЗАМЕТНАЯ ====================
            const gridGroup = new THREE.Group();
            const gridLines = [];
            const gs = 10;
            const gStep = 0.35;
            const allPoints = [];

            for (let y = -gs/2; y <= gs/2; y += gStep) {
                for (let x = -gs/2; x <= gs/2; x += gStep) {
                    const offsetX = (Math.random() - 0.5) * 0.18;
                    const offsetY = (Math.random() - 0.5) * 0.18;
                    allPoints.push({ x: x + offsetX, y: y + offsetY, z: 0 });
                }
            }
        
            function addTriangle(p1, p2, p3, baseColor) {
                const points = [
                    new THREE.Vector3(p1.x, p1.y, 0),
                    new THREE.Vector3(p2.x, p2.y, 0),
                    new THREE.Vector3(p3.x, p3.y, 0),
                    new THREE.Vector3(p1.x, p1.y, 0)
                ];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({ 
                    color: baseColor, transparent: true, opacity: 0.03
                });
                const line = new THREE.Line(geo, mat);
                line.userData = { baseColor: baseColor, avgY: (p1.y + p2.y + p3.y) / 3 };
                gridGroup.add(line);
                gridLines.push(line);
            }
        
            const cols = Math.floor(gs / gStep) + 1;
            for (let row = 0; row < cols - 1; row++) {
                for (let col = 0; col < cols - 1; col++) {
                    const idx = row * cols + col;
                    const p1 = allPoints[idx];
                    const p2 = allPoints[idx + 1];
                    const p3 = allPoints[idx + cols];
                    const p4 = allPoints[idx + cols + 1];
        
                    if (p1 && p2 && p3) {
                        const shade = 0.5 + Math.random() * 0.3;
                        const color = new THREE.Color().setHSL(0, 0, shade * 0.4);
                        addTriangle(p1, p2, p3, color.getHex());
                    }
                    if (p2 && p3 && p4) {
                        const shade = 0.5 + Math.random() * 0.3;
                        const color = new THREE.Color().setHSL(0, 0, shade * 0.3);
                        addTriangle(p2, p3, p4, color.getHex());
                    }
                }
            }

            gridGroup.position.set(0, -0.3, -2.0);
            gridGroup.rotation.x = -0.2;
            scene.add(gridGroup);
        
            // ==================== АНИМАЦИЯ ====================
            let waveY = -gs/2 - 1.5;
            const waveSpeed = 2.5;
            const waveWidth = 6.0;
            let lastTime = performance.now();
        
            function animate() {
                requestAnimationFrame(animate);
        
                const now = performance.now();
                let deltaTime = (now - lastTime) / 1000;
                lastTime = now;
                if (deltaTime > 0.1) deltaTime = 0.1;
        
                sphereGroup.rotation.y += 0.002;
                sphereGroup.rotation.x = Math.sin(Date.now() * 0.0005) * 0.1;

                stationGroup.rotation.z += 0.004;
                stationGroup2.rotation.z -= 0.003;
        
                waveY += waveSpeed * deltaTime;
                if (waveY > gs/2 + 2) waveY = -gs/2 - 2;
        
                gridLines.forEach((l) => {
                    const avgY = l.userData.avgY;
                    const dist = Math.abs(waveY - avgY);
                    const waveBoost = dist < waveWidth ? (1 - dist / waveWidth) * 0.12 : 0;
                    l.material.opacity = 0.03 + waveBoost;
                    l.material.color.setHex(l.userData.baseColor);
                });
        
                renderer.render(scene, camera);
            }
            animate();
        
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        
            // Текст
            const phrases = ['YAR-AiD', 'РАЗРАБОТКА', 'АВТОМАТИЗАЦИЯ', 'AI-ИНТЕГРАЦИЯ'];
            let phraseIndex = 0;
            const textEl = document.getElementById('rotatingText');
            const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        
            function scrambleTo(newText, cb) {
                const old = textEl.textContent;
                const maxLen = Math.max(old.length, newText.length);
                let it = 0, maxIt = 15;
                const iv = setInterval(() => {
                    let r = '';
                    for (let i = 0; i < maxLen; i++) {
                        r += (it > maxIt * (i / maxLen)) ? (newText[i] || '') : chars[Math.floor(Math.random() * chars.length)];
                    }
                    textEl.textContent = r;
                    it++;
                    if (it > maxIt) { 
                        clearInterval(iv); 
                        textEl.textContent = newText; 
                        if (cb) cb(); 
                    }
                }, 60);
            }
        
            function changePhrase() {
                phraseIndex = (phraseIndex + 1) % phrases.length;
                const np = phrases[phraseIndex];
                textEl.style.transform = `translate(${(Math.random() - 0.5) * 10}px, ${(Math.random() - 0.5) * 5}px)`;
                textEl.style.opacity = '0.5';
                setTimeout(() => { 
                    textEl.style.transform = 'translate(0,0)'; 
                    textEl.style.opacity = '1'; 
                    scrambleTo(np); 
                }, 150);
            }

            setInterval(changePhrase, 3000);
        }
    </script>
</body>
</html>
