<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAROSLAV-AiD</title>
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #050510;
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(5, 5, 20, 0.85) 100%);
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
        
        /* ========== ДЕСКТОП: МЕНЮ ========== */
        .menu-panel {
            position: absolute;
            top: 0;
            right: -420px;
            width: 380px;
            height: 100%;
            background: rgba(8, 12, 24, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(100, 150, 255, 0.15);
            z-index: 30;
            transition: right 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 50px;
            box-sizing: border-box;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.02em;
        }
        .menu-panel.open {
            right: 0;
        }
        .menu-panel h2 {
            color: #fff;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 34px;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-top: -20px;
        }
        .menu-panel a {
            color: rgba(220, 225, 245, 0.75);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 400;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s ease;
            display: block;
            cursor: pointer;
            position: relative;
        }
        .menu-panel a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 1px;
            background: rgba(120, 170, 255, 0.7);
            transition: width 0.4s ease;
        }
        .menu-panel a:hover {
            color: #fff;
            padding-left: 20px;
        }
        .menu-panel a:hover::after {
            width: 100%;
        }
        .menu-close {
            position: absolute;
            top: 28px;
            right: 28px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-close:hover {
            opacity: 1;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        canvas.blurred {
            filter: blur(8px);
        }
        
        /* ========== МОБИЛЬНАЯ: ОВЕРЛЕЙ ========== */
        .mobile-overlay {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            padding-bottom: 70px;
        }
        .mobile-overlay .rotating-text {
            color: transparent;
            background: linear-gradient(135deg, #a0c0ff 0%, #ffffff 40%, #c0a0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 40px;
            transition: opacity 0.6s ease;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 30px rgba(140, 170, 255, 0.4);
            filter: drop-shadow(0 0 8px rgba(120, 150, 255, 0.5));
        }
        .mobile-overlay .contacts {
            color: rgba(200, 210, 240, 0.5);
            font-size: 1rem;
            letter-spacing: 0.15em;
            padding-left: 30px;
            padding-right: 30px;
            line-height: 1.8;
            font-weight: 300;
        }
        
        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 767px) {
            .menu-panel {
                display: none;
            }
            .mobile-overlay {
                display: block;
            }
            canvas.blurred {
                filter: blur(4px);
            }
        }
        
        @media (min-width: 768px) {
            .mobile-overlay {
                display: none;
            }
            .menu-panel {
                display: flex;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-overlay .rotating-text {
            animation: fadeIn 1.2s ease forwards;
        }
    </style>
</head>
<body>
    <!-- ДЕСКТОПНОЕ МЕНЮ -->
    <div class="menu-panel" id="menuPanel">
        <button class="menu-close" id="menuClose">✕</button>
        <h2>YAROSLAV-AiD</h2>
        <a href="#">• Разработка</a>
        <a href="#">• Автоматизация</a>
        <a href="#">• AI-интеграции</a>
        <a href="#" style="margin-top: 30px;">diai_9@proton.me</a>
    </div>
    
    <!-- МОБИЛЬНЫЙ ОВЕРЛЕЙ -->
    <div class="mobile-overlay" id="mobileOverlay">
        <div class="rotating-text" id="rotatingText">Разработка</div>
        <div class="contacts">
            Telegram: @moslav9
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        const isMobile = window.innerWidth < 768;
        
        // ==================== ДЕСКТОПНАЯ СЦЕНА ====================
        if (!isMobile) {
            const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
            const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
            const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
            
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.00015);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050510, 1);
            document.body.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.5;

            const composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // ---- СФЕРА ----
            const sphereGroup = new THREE.Group();
            const radius = 1.2;
            const vectorCount = 2500;
            const linesGroup = new THREE.Group();
            
            for (let i = 0; i < vectorCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                const start = new THREE.Vector3(x, y, z);
                const normal = start.clone().normalize();
                const lengthVariation = 0.15 + Math.random() * 0.35;
                const end = start.clone().add(normal.multiplyScalar(lengthVariation));
                
                const mixFactor = (y / radius) * 0.5 + 0.5;
                const color = new THREE.Color().lerpColors(
                    new THREE.Color(0x00aaff),
                    new THREE.Color(0xaa44ff),
                    mixFactor
                );
                
                const lineGeo = new THREE.BufferGeometry();
                const vertices = new Float32Array([ start.x, start.y, start.z, end.x, end.y, end.z ]);
                lineGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                
                const lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
                const line = new THREE.Line(lineGeo, lineMat);
                
                line.userData = {
                    baseEnd: end.clone(),
                    normal: normal,
                    originalLength: lengthVariation,
                    start: start.clone(),
                    baseColor: color.clone(),
                    currentColor: color.clone()
                };
                
                linesGroup.add(line);
            }
            
            sphereGroup.add(linesGroup);
            
            const glowGeo = new THREE.BufferGeometry();
            const glowPositionsArr = [];
            linesGroup.children.forEach(line => {
                const positions = line.geometry.attributes.position.array;
                glowPositionsArr.push(positions[3], positions[4], positions[5]);
            });
            glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositionsArr), 3));
            const glowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.015, blending: THREE.AdditiveBlending, depthWrite: false });
            const glowPoints = new THREE.Points(glowGeo, glowMat);
            sphereGroup.add(glowPoints);
            scene.add(sphereGroup);

            // ---- ФОН ----
            const canvas2d = document.createElement('canvas');
            canvas2d.width = 32; canvas2d.height = 32;
            const ctx = canvas2d.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
            gradient.addColorStop(0, 'rgba(130, 150, 200, 1)');
            gradient.addColorStop(0.5, 'rgba(80, 130, 180, 0.6)');
            gradient.addColorStop(1, 'rgba(50, 50, 150, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            const particleTexture = new THREE.CanvasTexture(canvas2d);

            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 5500;
            const particlesPositionsArr = new Float32Array(particlesCount * 3);
            const particlesSizesArr = new Float32Array(particlesCount);
            for (let i = 0; i < particlesCount; i++) {
                particlesPositionsArr[i * 3] = (Math.random() - 0.5) * 15;
                particlesPositionsArr[i * 3 + 1] = (Math.random() - 0.5) * 8;
                particlesPositionsArr[i * 3 + 2] = (Math.random() - 0.5) * 10 - 2;
                particlesSizesArr[i] = Math.random() * 0.02 + 0.007;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPositionsArr, 3));
            particlesGeo.setAttribute('size', new THREE.BufferAttribute(particlesSizesArr, 1));

            const particlesMat = new THREE.PointsMaterial({
                map: particleTexture,
                color: 0xaaccff,
                size: 0.03,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.65
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            // ---- ПЕРЕМЕННЫЕ ----
            let mouseX = 0, mouseY = 0;
            let isShaking = false, shakeIntensity = 0;
            let colorCycle = 0;
            let menuOpen = false;
            let targetSphereX = 0;

            // ---- МЕНЮ ----
            const menuPanel = document.getElementById('menuPanel');
            const menuClose = document.getElementById('menuClose');
            const canvas = renderer.domElement;

            function openMenu() {
                menuOpen = true;
                menuPanel.classList.add('open');
                canvas.classList.add('blurred');
                targetSphereX = -1.2;
            }

            function closeMenu() {
                menuOpen = false;
                menuPanel.classList.remove('open');
                canvas.classList.remove('blurred');
                targetSphereX = 0;
            }

            menuClose.addEventListener('click', closeMenu);

            window.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                if (mouseX > 0.8 && !menuOpen) {
                    openMenu();
                }
            });

            document.addEventListener('click', function(e) {
                if (menuOpen) {
                    if (!menuPanel.contains(e.target)) {
                        closeMenu();
                    }
                    return;
                }
                
                if (e.target.tagName === 'CANVAS' || e.target === renderer.domElement) {
                    isShaking = true;
                    shakeIntensity = 0.5;
                    const fadeOut = setInterval(() => {
                        shakeIntensity -= 0.01;
                        if (shakeIntensity <= 0) {
                            shakeIntensity = 0;
                            isShaking = false;
                            clearInterval(fadeOut);
                        }
                    }, 30);
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });

            // ---- АНИМАЦИЯ ----
            function animate() {
                requestAnimationFrame(animate);
                sphereGroup.position.x = THREE.MathUtils.lerp(sphereGroup.position.x, targetSphereX, 0.05);
                sphereGroup.rotation.y += 0.0003;
                
                colorCycle += 0.0005;
                const colorShift = Math.sin(colorCycle) * 0.5 + 0.5;
                
                linesGroup.children.forEach((line, index) => {
                    if (line.userData && line.userData.baseEnd) {
                        const positions = line.geometry.attributes.position.array;
                        const start = line.userData.start;
                        const baseEnd = line.userData.baseEnd;
                        let currentEnd = baseEnd.clone();
                        
                        if (shakeIntensity > 0) {
                            const noise = 0.1 * shakeIntensity;
                            const time = Date.now() * 0.01;
                            const randomOffset = new THREE.Vector3(
                                Math.sin(time + index) * noise,
                                Math.cos(time * 0.8 + index) * noise,
                                Math.sin(time * 0.7 + index) * noise
                            );
                            currentEnd.add(randomOffset);
                        }
                        
                        positions[3] = currentEnd.x;
                        positions[4] = currentEnd.y;
                        positions[5] = currentEnd.z;
                        line.geometry.attributes.position.needsUpdate = true;
                        
                        const baseColor = line.userData.baseColor;
                        const targetColor = baseColor.clone();
                        targetColor.r = Math.min(1, baseColor.r + colorShift * 0.3);
                        targetColor.b = Math.min(1, baseColor.b + (1 - colorShift) * 0.3);
                        line.material.color.lerp(targetColor, 0.01);
                    }
                });
                
                particles.rotation.y += 0.0001;
                particles.rotation.x += 0.00005;
                particles.position.x = mouseX * 0.5;
                particles.position.y = mouseY * 0.3;

                composer.render();
            }
            animate();
        }
        
        // ==================== МОБИЛЬНАЯ СЦЕНА ====================
        if (isMobile) {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050510, 1);
            document.body.appendChild(renderer.domElement);

            const sphereGroup = new THREE.Group();
            const geometry = new THREE.IcosahedronGeometry(0.8, 4);
            
            const edgesGeo = new THREE.EdgesGeometry(geometry);
            const edgesMat = new THREE.LineBasicMaterial({ 
                color: 0x4488cc, 
                transparent: true, 
                opacity: 0.45 
            });
            const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
            sphereGroup.add(wireframe);
            
            const verts = geometry.attributes.position.array;
            const pointsArr = [];
            for (let i = 0; i < verts.length; i += 3) {
                pointsArr.push(verts[i], verts[i+1], verts[i+2]);
            }
            const pointsGeo = new THREE.BufferGeometry();
            pointsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pointsArr), 3));
            const pointsMat = new THREE.PointsMaterial({
                color: 0xaaccff,
                size: 0.02,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const points = new THREE.Points(pointsGeo, pointsMat);
            sphereGroup.add(points);
            
            sphereGroup.position.y = 0.4;
            scene.add(sphereGroup);

            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 1200;
            const starsArr = [];
            for (let i = 0; i < starsCount; i++) {
                starsArr.push((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 5 - 1);
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsArr), 3));
            const starsMat = new THREE.PointsMaterial({
                color: 0x6688bb,
                size: 0.025,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.55
            });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);

            renderer.domElement.addEventListener('click', () => {
                const normalSpeed = 0.002;
                const fastSpeed = 0.04;
                const duration = 1200;
                const startTime = performance.now();
                
                function animateBurst(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const speed = fastSpeed + (normalSpeed - fastSpeed) * (progress);
                    sphereGroup.rotation.y += speed;
                    if (progress < 1) {
                        requestAnimationFrame(animateBurst);
                    }
                }
                requestAnimationFrame(animateBurst);
            });

            function animate() {
                requestAnimationFrame(animate);
                sphereGroup.rotation.y += 0.002;
                sphereGroup.rotation.x = Math.sin(Date.now() * 0.0005) * 0.1;
                stars.rotation.y += 0.0002;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const phrases = ['Разработка', 'Автоматизация', 'AI-интеграция'];
            let phraseIndex = 0;
            const textEl = document.getElementById('rotatingText');

            setInterval(() => {
                textEl.style.opacity = '0';
                setTimeout(() => {
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    textEl.textContent = phrases[phraseIndex];
                    textEl.style.opacity = '1';
                }, 800);
            }, 3000);
        }
    </script>
</body>
</html>
